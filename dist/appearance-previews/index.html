<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>净水节点 · 外观与端口动画预览</title>
<style>
  body { margin: 0; background: #08111b; color: #e8f5ff; font: 16px/1.55 system-ui, sans-serif; }
  main { max-width: 1180px; margin: auto; padding: 28px 22px 60px; }
  a { color: #80d9ff; }
  p { max-width: 78ch; color: #afc4d3; }
  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 18px 0; }
  button { border: 1px solid #608fa5; border-radius: 7px; background: #193247; color: #e8f5ff; padding: 8px 15px; cursor: pointer; }
  button[aria-pressed="true"] { background: #146b76; border-color: #79e4de; }
  figure { margin: 18px 0; background: #102330; border: 1px solid #34536a; border-radius: 12px; overflow: hidden; padding: 16px; }
  #stage { position: relative; width: 100%; aspect-ratio: 2 / 1; }
  #stage img { position: absolute; top: 0; left: 0; display: block; width: 100%; height: auto; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  small { color: #a8bcc9; }
</style>
</head>
<body>
<main>
  <a href="../">返回素材库首页</a>
  <h1>净水节点</h1>
  <p>四台闸门与武陵试验园区的墙体、平台共同组成设施。三台闸门是管道输入，一台是管道输出。以下动画引用当前版本闸门配置中的端口 ON/OFF 特效。</p>
  <div class="controls" aria-label="端口连接状态">
    <span>管道连接状态：</span>
    <button type="button" data-state="off" aria-pressed="true">未连接 · OFF</button>
    <button type="button" data-state="on" aria-pressed="false">已连接 · ON</button>
    <small id="motion-status">正在加载端口动画…</small>
  </div>
  <figure>
    <div id="stage"><img src="liquidcleanfactory_005_1.webp" width="1920" height="896" alt="净水节点四台闸门与周围环境的俯视外观"><canvas id="effects" width="1920" height="960" aria-hidden="true"></canvas></div>
  </figure>
  <p>这是外观预览。四台闸门的位置依据环境支座近似拼接，端口叠加位置尚未用游戏运行时矩阵验证，也未做深度遮挡。当前配置没有单独绑定端口环；端口处的发光边缘属于 ON/OFF 特效。</p>
</main>
<script>
(() => {
  const canvas = document.getElementById('effects');
  const ctx = canvas.getContext('2d');
  const status = document.getElementById('motion-status');
  const buttons = Array.from(document.querySelectorAll('button[data-state]'));
  let selected = 'off';
  let started = performance.now();
  buttons.forEach(button => button.addEventListener('click', () => {
    selected = button.dataset.state;
    started = performance.now();
    buttons.forEach(other => other.setAttribute('aria-pressed', String(other === button)));
  }));
  const loadImage = src => new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = () => reject(new Error('图片加载失败：' + src));
    image.src = src;
  });
  fetch('port-effects.json').then(response => {
    if (!response.ok) throw new Error('端口动画未随预览发布');
    return response.json();
  }).then(async data => {
    const effects = new Map();
    await Promise.all(data.effects.map(async effect => {
      effect.image = await loadImage(effect.sheet);
      effects.set(effect.role + ':' + effect.state, effect);
    }));
    status.textContent = '端口动画已加载 · 位置为外观估算';
    function draw(now) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const port of data.instances) {
        const effect = effects.get(port.role + ':' + selected);
        if (!effect) continue;
        const phase = (now - started) % effect.durationMs;
        const index = Math.floor(phase / effect.durationMs * effect.frameCount) % effect.frameCount;
        const frame = effect.frames[index];
        ctx.save();
        ctx.translate(port.pixelAnchor[0], port.pixelAnchor[1]);
        ctx.rotate(port.yawDegrees * Math.PI / 180);
        ctx.drawImage(effect.image, frame.x, frame.y, frame.width, frame.height,
          -effect.pivotPixels[0] / 2, -effect.pivotPixels[1] / 2,
          frame.width / 2, frame.height / 2);
        ctx.restore();
      }
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  }).catch(error => { status.textContent = error.message; });
})();
</script>
</body>
</html>
