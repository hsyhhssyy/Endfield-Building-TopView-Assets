<script>
(async function () {
  const $ = id => document.getElementById(id);
  const status = $('status');
  try {
    if (location.protocol === 'file:') {
      throw new Error('请在本目录运行 python -m http.server 8765 --bind 127.0.0.1，再打开 http://127.0.0.1:8765/preview.html。所有依赖已附带，不需要 CDN。');
    }
    const app = new PIXI.Application();
    await app.init({ resizeTo: $('view'), background: '#11191b', preference: 'webgl',
      resolution: Math.min(devicePixelRatio || 1, 2), antialias: false });
    $('view').appendChild(app.canvas);
    let ground;
    let grid;
    let rebuilding = false;
    const render = () => app.render();
    function report() {
      status.textContent = `Pixi ${PIXI.VERSION} · ${ground.placements.length} 个装饰 · 种子 ${ground.seed} · 缩放 ${Math.round(ground.root.scale.x * 100)}%`;
    }
    function center(scale) {
      ground.root.scale.set(scale);
      ground.root.position.set((app.screen.width - ground.width * scale) / 2,
        (app.screen.height - ground.height * scale) / 2);
      report(); render();
    }
    function fit() { center(Math.min(app.screen.width / ground.width, app.screen.height / ground.height) * 0.97); }
    function layers() {
      ground.layers.patches.visible = $('patches').checked;
      ground.layers.gravel.visible = $('gravel').checked;
      ground.layers.buildings.visible = $('building').checked;
      grid.visible = $('grid').checked;
      render();
    }
    async function rebuild() {
      if (rebuilding) return;
      rebuilding = true;
      try {
        const next = await PixiGround.createGround(PIXI, { seed: Number($('seed').value) | 0 });
        const soil = next.manifest.profile === 'farmland-soil';
        document.title = soil ? '田块土地素材包' : 'Pixi 草地素材';
        document.querySelector('h1').textContent = `${document.title} · ${next.manifest.pixelsPerWorldUnit} 像素/格`;
        $('patch-label').textContent = soil ? '土色变化' : '大草斑';
        $('building-label').textContent = soil ? '正式田块参考' : '建筑参考';
        $('gravel-control').hidden = soil;
        const refs = next.manifest.previewReferences?.length ? next.manifest.previewReferences :
          [[19, 17, 0], [37, 28, 90], [48, 16, 180]].map(([x,y,rotation]) => ({
            file: 'previews/building-reference.webp', position: [x,y], rotation,
            worldSize: next.manifest.previewBuildingWorldSize ?? 5.903646469116211
          }));
        for (const ref of refs) {
          const texture = await PIXI.Assets.load({src: ref.file,
            data: {autoGenerateMipmaps: true, scaleMode: 'linear', mipmapFilter: 'linear'}});
          const [x,y] = ref.position;
          const building = new PIXI.Sprite(texture);
          building.anchor.set(0.5);
          building.label = ref.name ?? 'reference';
          building.position.set((x - next.bounds[0]) * next.pixelsPerUnit, (y - next.bounds[1]) * next.pixelsPerUnit);
          building.scale.set(ref.worldSize * next.pixelsPerUnit / texture.width);
          building.rotation = (ref.rotation ?? 0) * Math.PI / 180;
          next.layers.buildings.addChild(building);
        }
        if (ground) {
          app.stage.removeChild(ground.root);
          ground.root.destroy({ children: true }); // Preserve shared cached textures.
        }
        ground = next;
        app.stage.addChild(ground.root);
        grid = new PIXI.Graphics();
        for (let x = 0; x <= ground.width; x += (ground.manifest.baseWorldSize ?? 16) * ground.pixelsPerUnit) grid.moveTo(x, 0).lineTo(x, ground.height);
        for (let y = 0; y <= ground.height; y += (ground.manifest.baseWorldSize ?? 16) * ground.pixelsPerUnit) grid.moveTo(0, y).lineTo(ground.width, y);
        grid.stroke({ width: 2, color: 0xe3ca6e, alpha: 0.65 });
        ground.root.addChild(grid);
        window.groundDemo = { app, ground, fit, center, layers, rebuild };
        layers(); fit();
        document.body.dataset.status = 'ready';
        document.body.dataset.seed = ground.seed;
        document.body.dataset.placements = ground.placements.length;
      } finally { rebuilding = false; }
    }
    await rebuild();
    app.stop();
    $('shuffle').onclick = () => {
      $('seed').value = (Number($('seed').value) + 7919) >>> 0;
      rebuild().catch(fail);
    };
    $('seed').onchange = () => rebuild().catch(fail);
    for (const key of ['patches', 'gravel', 'building', 'grid']) $(key).onchange = layers;
    $('fit').onclick = fit;
    $('native').onclick = () => center(1);
    let previous = null;
    app.canvas.onpointerdown = event => {
      previous = [event.clientX, event.clientY];
      app.canvas.setPointerCapture(event.pointerId);
    };
    app.canvas.onpointermove = event => {
      if (!previous) return;
      ground.root.x += event.clientX - previous[0];
      ground.root.y += event.clientY - previous[1];
      previous = [event.clientX, event.clientY]; render();
    };
    app.canvas.onpointerup = app.canvas.onpointercancel = () => { previous = null; };
    app.canvas.addEventListener('wheel', event => {
      event.preventDefault();
      const rect = app.canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const old = ground.root.scale.x;
      const next = Math.max(0.08, Math.min(3, old * Math.exp(-event.deltaY * 0.001)));
      ground.root.position.set(x - (x - ground.root.x) * next / old,
        y - (y - ground.root.y) * next / old);
      ground.root.scale.set(next); report(); render();
    }, { passive: false });
    window.addEventListener('resize', () => { app.resize(); fit(); });
    function fail(error) {
      document.body.dataset.status = 'error';
      status.className = 'error'; status.textContent = error.message;
      console.error(error);
    }
  } catch (error) {
    document.body.dataset.status = 'error';
    status.className = 'error'; status.textContent = error.message;
    console.error(error);
  }
})();
